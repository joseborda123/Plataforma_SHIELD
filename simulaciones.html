              <div style="font-size:12px;color:var(--text-faint);">Compra en línea</div>
              <div style="font-weight:700;">Comprador interesado</div>
            </div>
            <span class="badge badge-medio">Medio</span>
          </div>
          <div style="background:var(--panel);border-radius:14px;padding:16px;font-size:13px;line-height:1.6;">
            "Hola, el artículo me interesa. Pagaremos más si haces la transacción fuera de la app. Envíame tu número de cuenta o Yape para transferir directo.".
          </div>
        </div>
        <div style="margin-top:20px;">
          <p class="fs-13" style="margin-bottom:16px;"><b>¿Por qué es sospechoso este mensaje?</b></p>
          <div style="display:flex;flex-direction:column;gap:10px;">
            <label style="cursor:pointer;display:flex;align-items:center;gap:10px;">
              <input type="checkbox" onchange="verificarRespuesta('marketplace')"> Pide mover la conversación fuera de la plataforma segura
            </label>
            <label style="cursor:pointer;display:flex;align-items:center;gap:10px;">
              <input type="checkbox" onchange="verificarRespuesta('marketplace')"> Ofrece pagar más para evitar las reglas del marketplace
            </label>
            <label style="cursor:pointer;display:flex;align-items:center;gap:10px;">
              <input type="checkbox" onchange="verificarRespuesta('marketplace')"> Solicita datos de pago directos en lugar del método oficial
            </label>
            <label style="cursor:pointer;display:flex;align-items:center;gap:10px;">
              <input type="checkbox" onchange="verificarRespuesta('marketplace')"> Intenta generar presión para actuar rápido
            </label>
          </div>
          <button class="btn btn-primary btn-block mt-16" onclick="verificarSimulacion('marketplace')">Enviar respuesta</button>
        </div>
      `
    }
  };

  let respuestasUsuario = {};
  let simActual = null;

  function detectarAlerta(index) {
    Shield.toast('danger', 'No hagas clic', 'Este es un botón de phishing simulado. ¡Buena reacción!');
  }

  function responderSMS(opcion) {
    simActual = 'sms';
    if (opcion === 'bien') {
      Shield.toast('success', '¡Correcto!', 'Identificaste el SMS de phishing. Los premios no se reclaman por SMS.');
      setTimeout(() => {
        finalizarSimulacion('sms', 80);
      }, 1500);
    } else {
      Shield.toast('danger', 'Incorrecto', 'Caíste en la estafa. Estos SMS son phishing común.');
      setTimeout(() => {
        Shield.closeModal('modalSimInteractive');
      }, 1500);
    }
  }

  function verificarRespuesta(simId) {
    // Solo para tracking
  }

  function verificarSimulacion(simId) {
    const checkboxes = Shield.qsa('#simContent input[type="checkbox"]:checked', document);
    const totalCheckboxes = Shield.qsa('#simContent input[type="checkbox"]', document).length;
    
    if (checkboxes.length === totalCheckboxes) {
      Shield.toast('success', '¡Perfecto!', 'Identificaste todas las señales de alerta correctamente.');
      setTimeout(() => {
        const xp = interactiveSims[simId] ? interactiveSims[simId].xp : 0;
        finalizarSimulacion(simId, xp);
      }, 1500);
    } else {
      Shield.toast('warning', 'No completaste', 'Te faltaron ' + (totalCheckboxes - checkboxes.length) + ' señales de alerta.');
    }
  }

  function finalizarSimulacion(simId, xp) {
    Shield.closeModal('modalSimInteractive');
    Shield.toast('success', '¡Simulación completada!', 'Ganaste +' + xp + ' XP');
  }

  function iniciarSimulacion(id) {
    if (interactiveSims[id]) {
      simActual = id;
      const sim = interactiveSims[id];
      document.getElementById('simInteractiveTitle').textContent = sim.title;
      document.getElementById('simContent').innerHTML = sim.html;
      Shield.openModal('modalSimInteractive');
    } else {
      Shield.toast('info', 'Simulación iniciada', 'Mantente alerta a las señales de estafa…');
      setTimeout(() => Shield.toast('success', '¡Bien hecho!', 'Detectaste la estafa correctamente. +120 XP'), 2200);
    }
  }

  const grid = document.getElementById('simGrid');
  function render(filter){
    const list = filter === 'todas' ? sims : sims.filter(s => s.cat === filter);
    grid.innerHTML = list.map(s => `
      <div class="card sim-card" data-reveal>
        <div class="flex justify-between items-start">
          <div class="sim-icon ${s.color}"><i class="fa-solid ${s.icon.replace('fa-solid ','')}"></i></div>
          <span class="badge badge-${s.level==='Crítico'?'critico':s.level==='Alto'?'alto':'medio'}">${s.level}</span>
        </div>
        <div>
          <h3 class="fs-14">${s.title}</h3>
          <p class="fs-13 mt-8">${s.desc}</p>
        </div>
        <div class="sim-meta">
          <span><i class="fa-regular fa-clock"></i> ${s.time}</span>
          <span><i class="fa-solid fa-bolt"></i> ${s.xp} XP</span>
        </div>
        <button class="btn btn-primary btn-block start-sim" data-id="${s.id}" data-title="${s.title}">
          <i class="fa-solid fa-play"></i> Iniciar
        </button>
      </div>`).join('');

    Shield.qsa('.start-sim', grid).forEach(btn => btn.addEventListener('click', () => {
      iniciarSimulacion(btn.dataset.id);
    }));
  }
  render('todas');

  Shield.qsa('.chip').forEach(chip => chip.addEventListener('click', () => {
    Shield.qsa('.chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    render(chip.dataset.filter);
  }));

  Shield.wireReveal();
</script>
</body>
</html>
